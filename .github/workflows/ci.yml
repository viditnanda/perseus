# Build and test on every push and pull request.
name: ci
on: [push, pull_request]
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: make portable
      - name: Python dependencies
        run: python -m pip install numpy pybind11 setuptools
      - name: Differential tests (sections B, E, F, G; A needs Ripser)
        run: python tests/run_tests.py B E F G
      - name: Component arithmetic fallbacks and concurrent reruns
        run: make test-rips-components
      - name: Cubical engines against each other
        run: make test-cubical
      - name: Python module
        run: |
          python -m pip install --no-build-isolation ./python
          cd /tmp && python $GITHUB_WORKSPACE/tests/test_python.py
        env: { PERSEUS: "${{ github.workspace }}/perseus" }
      - name: Examples (command line and Python)
        run: sh examples/run_all.sh
        env: { PERSEUS: "${{ github.workspace }}/perseus" }
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with: { msystem: UCRT64, install: "make mingw-w64-ucrt-x86_64-gcc" }
      - name: Build (MinGW-w64; MSVC has no 128-bit integers)
        run: g++ -std=c++17 -O3 -Wall -pthread -Iinclude src/perseus.cpp -o perseus.exe -static
      - name: Smoke test
        run: ./perseus.exe cells tests/fixtures/crt_alias_1.cells --print json | grep -q 294719631262177595678027596519
