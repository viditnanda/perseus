# On a version tag (e.g. v6.0.0): build the command-line binaries and attach them to a GitHub release,
# build the Python wheels and sdist, and publish them to PyPI (trusted publishing; see RELEASING.md).
# It can also be rerun for an existing tag without moving it: push a branch named release/<tag>
# (e.g. release/v6.0.0), or use "Run workflow" in the Actions tab. The code built is always the tag's.
name: release
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "existing tag to build and publish", required: true }
permissions:
  contents: write
jobs:
  meta:   # the tag to build: the pushed tag, the tag named by a release/<tag> branch, or the dispatch input
    runs-on: ubuntu-latest
    outputs: { tag: "${{ steps.t.outputs.tag }}" }
    steps:
      - id: t
        env: { INPUT_TAG: "${{ inputs.tag }}", REF_NAME: "${{ github.ref_name }}" }
        run: |
          tag="${INPUT_TAG:-${REF_NAME#release/}}"
          case "$tag" in v*) ;; *) echo "not a version tag: $tag"; exit 1;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  binaries:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: perseus-linux-x86_64, cmd: "g++ -std=c++17 -O3 -pthread -Iinclude src/perseus.cpp -o out -static" }
          - { os: macos-15,      name: perseus-macos-arm64,  cmd: "clang++ -std=c++17 -O3 -pthread -Iinclude src/perseus.cpp -o out" }
          - { os: macos-15-intel,      name: perseus-macos-x86_64, cmd: "clang++ -std=c++17 -O3 -pthread -Iinclude src/perseus.cpp -o out" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.tag }}" }
      - run: ${{ matrix.cmd }} && mv out ${{ matrix.name }} && ./${{ matrix.name }} cells tests/fixtures/crt_alias_1.cells --print none
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "${{ matrix.name }}" }
  windows:
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.tag }}" }
      - uses: msys2/setup-msys2@v2
        with: { msystem: UCRT64, install: "mingw-w64-ucrt-x86_64-gcc" }
      - run: g++ -std=c++17 -O3 -pthread -Iinclude src/perseus.cpp -o perseus-windows-x86_64.exe -static && ./perseus-windows-x86_64.exe cells tests/fixtures/crt_alias_1.cells --print none
      - uses: actions/upload-artifact@v4
        with: { name: perseus-windows-x86_64.exe, path: perseus-windows-x86_64.exe }
  github-release:
    needs: [meta, binaries, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4   # the executables only
        with: { path: dist, pattern: "perseus-*", merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*", tag_name: "${{ needs.meta.outputs.tag }}" }
  wheels:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.tag }}" }
      - uses: pypa/cibuildwheel@v2.21
        with: { package-dir: python }
        env:
          CIBW_SKIP: "pp* *musllinux* *i686*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28   # numpy no longer ships manylinux2014 wheels for new Pythons
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python -c "import perseus; r = perseus.cells([(0, 0.0, []), (1, 1.0, []), (2, 2.0, [(1, 12)])]); assert perseus.bad_primes(r) == [2, 3]"
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-${{ matrix.os }}", path: wheelhouse/*.whl }
  sdist:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.tag }}" }
      - run: cp -r include python/include && pipx run build --sdist python --outdir dist
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }
  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4   # wheels and sdist only, not the executables
        with: { path: dist, pattern: "wheels-*", merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { path: dist, name: sdist }
      - uses: pypa/gh-action-pypi-publish@release/v1
